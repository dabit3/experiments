name: PrismSixteen
options:
  bundleIdPrefix: ai.prismsixteen
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: Prism Sixteen
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your Prism Sixteen room server.
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
targets:
  PrismSixteen:
    type: application
    platform: iOS
    sources:
      - App
      - path: Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Prism Sixteen
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Connect to your Prism Sixteen room server.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.prismsixteen.game
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  PrismSixteen:
    build:
      targets:
        PrismSixteen: all
