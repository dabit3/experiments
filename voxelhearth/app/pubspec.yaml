name: voxelhearth
description: "Voxelhearth - an original cross-platform voxel sandbox with authoritative multiplayer."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.0
  flame: ^1.32.0
  shared_preferences: ^2.5.3
  voxelhearth_core:
    path: ../packages/voxelhearth_core
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/voxel.frag
  assets:
    - assets/audio/
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
