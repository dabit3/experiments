name: voxelhearth_server
description: Authoritative Voxelhearth multiplayer server (JSON over WebSocket) with persistent worlds, rooms, bots and a test director channel.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  args: ^2.6.0
  path: ^1.9.0
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  shelf_web_socket: ^3.0.0
  voxelhearth_core:
    path: ../packages/voxelhearth_core
  web_socket_channel: ^3.0.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
