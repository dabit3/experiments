name: LaserOverdrive
options:
  bundleIdPrefix: ai.devin.arcade
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  LaserOverdrive:
    type: application
    platform: iOS
    sources: [App]
    resources:
      - path: Resources/chart.json
      - path: Resources/afterburn.m4a
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Laser Overdrive
        CFBundleIdentifier: ai.devin.arcade.laseroverdrive
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        NSLocalNetworkUsageDescription: Connect to your Laser Overdrive room host on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.arcade.laseroverdrive
schemes:
  LaserOverdrive:
    build:
      targets:
        LaserOverdrive: all
