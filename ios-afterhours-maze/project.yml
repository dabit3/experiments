name: AfterhoursMaze
options:
  bundleIdPrefix: studio.afterhours
  deploymentTarget:
    iOS: "17.0"
packages:
  AfterhoursCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
targets:
  AfterhoursMaze:
    type: application
    platform: iOS
    sources:
      - Sources/AfterhoursApp
    dependencies:
      - package: AfterhoursCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.afterhours.maze
        PRODUCT_NAME: AfterhoursMaze
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Afterhours
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: YES
schemes:
  AfterhoursMaze:
    build:
      targets:
        AfterhoursMaze: all
