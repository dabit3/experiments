name: HiveSovereign
options:
  bundleIdPrefix: ai.hivesovereign
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  HiveSovereign:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.hivesovereign.native
        INFOPLIST_KEY_CFBundleDisplayName: Hive Sovereign
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hive Sovereign
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        NSLocalNetworkUsageDescription: Connect to the Hive Sovereign host and play with another captain on your local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: Hive Sovereign Test Driver
            CFBundleURLSchemes: [hivesovereign]
  HiveSovereignUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HiveSovereign
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HiveSovereign:
    build:
      targets:
        HiveSovereign: all
    test:
      targets: [HiveSovereignUITests]
