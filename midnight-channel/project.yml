name: MidnightChannel
options:
  bundleIdPrefix: ai.devin.midnightchannel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
targets:
  MidnightChannel:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes: [duel-card.png, FighterSheets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.midnightchannel.ios
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: MidnightChannel
    scheme:
      gatherCoverageData: false
