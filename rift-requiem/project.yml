name: RiftRequiem
options:
  bundleIdPrefix: ai.riftrequiem
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
targets:
  RiftRequiem:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.riftrequiem.duel
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets: [RiftRequiemUITests]
  RiftRequiemUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RiftRequiem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.riftrequiem.duel.tests
        GENERATE_INFOPLIST_FILE: YES
