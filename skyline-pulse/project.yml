name: SkylinePulse
options:
  bundleIdPrefix: games.skylinepulse
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    CODE_SIGNING_ALLOWED: NO
targets:
  SkylinePulse:
    type: application
    platform: iOS
    sources:
      - App
      - path: Assets
        buildPhase: resources
        excludes:
          - "neon.wav"
          - "aurora.wav"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Skyline Pulse
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Connect to another guest on your local Skyline Pulse server.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: games.skylinepulse.arcade
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  SkylinePulse:
    build:
      targets:
        SkylinePulse: all
    run:
      config: Debug
