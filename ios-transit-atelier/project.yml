name: TransitAtelier
options:
  bundleIdPrefix: studio.atelier
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: NO
targets:
  TransitAtelier:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - Sources/Core
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.atelier.transit
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      gatherCoverageData: false
