name: FlappyOtter
options:
  bundleIdPrefix: studio.flappyotter
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: Flappy Otter
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  FlappyOtter:
    type: application
    platform: iOS
    sources: [App, Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.flappyotter.game
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  FlappyOtterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: FlappyOtter
schemes:
  FlappyOtter:
    build:
      targets:
        FlappyOtter: all
    test:
      targets: [FlappyOtterTests]
