name: brickfolk_server
description: Authoritative multiplayer server for Brickfolk (rooms, parties, chat, persistence).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.3

dependencies:
  args: ^2.7.0
  brickfolk_shared:
    path: ../shared
  shelf: ^1.4.2
  shelf_router: ^1.1.2
  shelf_static: ^1.1.3
  shelf_web_socket: ^3.0.0
  sqlite3: ^3.5.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  http: ^1.2.2
  lints: ^6.0.0
  test: ^1.25.6
