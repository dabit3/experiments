name: FestivalDon
options:
  bundleIdPrefix: ai.devin.festivaldon
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Festival Don
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIStatusBarHidden: YES
    INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: NO
targets:
  FestivalDon:
    type: application
    platform: iOS
    sources: [App, Resources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Festival Don
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Connect two drummers to the same local Festival Don server.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.festivaldon.rhythm
        PRODUCT_NAME: FestivalDon
  FestivalDonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: FestivalDon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.festivaldon.uitests
schemes:
  FestivalDon:
    build:
      targets:
        FestivalDon: all
    test:
      targets: [FestivalDonUITests]
