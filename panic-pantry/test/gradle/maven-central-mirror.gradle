// Optional Gradle init script for hosts where repo.maven.apache.org rate-limits
// requests (HTTP 429). Install with:
//   mkdir -p ~/.gradle/init.d && cp test/gradle/maven-central-mirror.gradle ~/.gradle/init.d/
// It points every Maven Central repository at Google's mirror and tries the mirror
// before the plugin portal (which redirects Central-hosted artifacts back to
// repo.maven.apache.org). Nothing else about dependency resolution changes.
def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
def remap = { repo ->
    if (repo instanceof MavenArtifactRepository && repo.url.toString().startsWith('https://repo.maven.apache.org/maven2')) {
        repo.url = mirror
    }
}
settingsEvaluated { settings ->
    def pm = settings.pluginManagement.repositories
    pm.all(remap)
    def first = pm.maven { url = mirror; name = 'MavenCentralMirror' }
    pm.remove(first)
    pm.addFirst(first)
    if (pm.size() == 1) {
        pm.gradlePluginPortal()
    }
    settings.dependencyResolutionManagement.repositories.all(remap)
    settings.buildscript.repositories.all(remap)
}
allprojects {
    buildscript.repositories.all(remap)
    repositories.all(remap)
}
