name: OrbitalVersus
options:
  bundleIdPrefix: ai.devin.orbitalversus
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Orbital Versus
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to a local Orbital Versus arena server and other pilots.
targets:
  OrbitalVersus:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.orbitalversus.ios
        PRODUCT_NAME: OrbitalVersus
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  OrbitalVersusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests
    dependencies:
      - target: OrbitalVersus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.devin.orbitalversus.uitests
        TEST_TARGET_NAME: OrbitalVersus
schemes:
  OrbitalVersus:
    build:
      targets:
        OrbitalVersus: all
    test:
      targets:
        - OrbitalVersusUITests
