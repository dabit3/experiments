name: nitro_tots
description: "Nitro Tots - an original cross-platform arcade kart racer."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flame: ^1.38.2
  flame_audio: ^2.12.2
  flutter:
    sdk: flutter
  go_router: ^18.0.1
  nitro_core:
    path: ../packages/nitro_core
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf

