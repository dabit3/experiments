name: OrchardSiege
options:
  bundleIdPrefix: garden.orchardsiege
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
targets:
  OrchardSiege:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Orchard Siege
        UILaunchScreen:
          UIColorName: LaunchColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: garden.orchardsiege.game
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OrchardSiegeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: OrchardSiege
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  OrchardSiege:
    build:
      targets:
        OrchardSiege: all
        OrchardSiegeTests: [test]
    test:
      targets: [OrchardSiegeTests]
