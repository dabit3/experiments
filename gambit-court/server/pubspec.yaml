name: gambit_court_server
description: Authoritative Gambit Court game server (rooms, clocks, bots, spectators) speaking JSON over WebSocket.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  args: ^2.5.0
  gambit_court_core:
    path: ../packages/gambit_court_core
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
